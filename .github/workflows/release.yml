name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  aria2:
    name: Build aria2c (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build aria2 (static, universal)
        run: |
          chmod +x scripts/build-aria2-universal.sh
          ./scripts/build-aria2-universal.sh "$PWD/vendor"
      - uses: actions/upload-artifact@v4
        with:
          name: aria2c
          path: vendor/aria2c

  torrent-helper:
    name: Build torrent helper (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Use CMake 3.29 (vcpkg 2024.09 ports misdetect the Apple sysroot under CMake 4)
        run: |
          curl -fsSL -o /tmp/cmake329.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.29.6/cmake-3.29.6-macos-universal.tar.gz
          mkdir -p "$HOME/cmake329" && tar xzf /tmp/cmake329.tar.gz -C "$HOME/cmake329" --strip-components=1
          echo "$HOME/cmake329/CMake.app/Contents/bin" >> "$GITHUB_PATH"
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build-torrent/vcpkg
            build-torrent/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('scripts/build-libtorrent-universal.sh') }}
      - name: Build libtorrent helper (static, universal)
        run: |
          chmod +x scripts/build-libtorrent-universal.sh
          ./scripts/build-libtorrent-universal.sh "$PWD/vendor"
      - uses: actions/upload-artifact@v4
        with:
          name: mcdownloader-torrentd
          path: vendor/mcdownloader-torrentd

  app:
    name: Build & package app
    runs-on: macos-14
    needs: [aria2, torrent-helper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aria2c
          path: vendor
      - uses: actions/download-artifact@v4
        with:
          name: mcdownloader-torrentd
          path: vendor

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (SwiftPM, release, universal)
        working-directory: App
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Generate the app icon (placeholder)
        run: |
          chmod +x scripts/make-icon.sh
          ./scripts/make-icon.sh assets/AppIcon.icns

      - name: Package .app
        run: |
          BIN_PATH="$(swift build -c release --arch arm64 --arch x86_64 --package-path App --show-bin-path)"
          chmod +x scripts/package-app.sh
          ./scripts/package-app.sh \
            --binary "$BIN_PATH/McDownloader" \
            --host "$BIN_PATH/mcdownloader-host" \
            --out dist \
            --aria2 vendor/aria2c \
            --torrent-helper vendor/mcdownloader-torrentd \
            --icon assets/AppIcon.icns \
            --version "${{ steps.version.outputs.value }}" \
            --commit "${GITHUB_SHA::7}"

      - name: Bundle the browser extension
        run: |
          mkdir -p dist/extension
          cp -R Extension/* dist/extension/

      - name: Create DMG
        run: |
          chmod +x scripts/make-dmg.sh
          ./scripts/make-dmg.sh dist/McDownloader.app "dist/McDownloader-${{ steps.version.outputs.value }}.dmg" "${{ steps.version.outputs.value }}"

      - name: Zip the app (portable alternative to the DMG)
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/McDownloader.app \
            "dist/McDownloader-${{ steps.version.outputs.value }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: McDownloader-${{ steps.version.outputs.value }}
          path: |
            dist/McDownloader-*.dmg
            dist/McDownloader-*.zip
            dist/extension/**

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [app]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/McDownloader-*/*.dmg
            artifacts/McDownloader-*/*.zip
          generate_release_notes: true
