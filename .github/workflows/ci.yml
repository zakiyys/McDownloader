name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Build app (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build (SwiftPM, release)
        working-directory: App
        run: swift build -c release

      - name: Package .app (no engines)
        run: |
          BIN_PATH="$(swift build -c release --package-path App --show-bin-path)"
          chmod +x scripts/package-app.sh
          ./scripts/package-app.sh --binary "$BIN_PATH/McDownloader" --host "$BIN_PATH/mcdownloader-host" \
            --out dist --version 0.0.0-ci --commit "${GITHUB_SHA::7}"
          test -x "dist/McDownloader.app/Contents/MacOS/McDownloader"
          test -x "dist/McDownloader.app/Contents/MacOS/mcdownloader-host"
          test -d "dist/McDownloader.app/Contents/Resources/extension"
          /usr/libexec/PlistBuddy -c "Print" dist/McDownloader.app/Contents/Info.plist | head -5

      - name: Verify the binary is universal-ready and signed
        run: |
          codesign --verify --deep --verbose=2 dist/McDownloader.app || true
          file dist/McDownloader.app/Contents/MacOS/McDownloader

  extension:
    name: Lint extension (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check the extension scripts
        run: |
          node --check Extension/background.js
          node --check Extension/popup.js
          node --check Extension/options.js
      - name: Validate the manifest
        run: node -e "JSON.parse(require('fs').readFileSync('Extension/manifest.json','utf8')); console.log('manifest ok')"
      - name: The pinned extension ID matches its key (and the app's copy)
        run: |
          node -e '
          const fs = require("fs"), crypto = require("crypto");
          const manifest = JSON.parse(fs.readFileSync("Extension/manifest.json", "utf8"));
          if (!manifest.key) { console.error("manifest.json has no key"); process.exit(1); }
          if (!manifest.permissions.includes("nativeMessaging")) { console.error("nativeMessaging permission missing"); process.exit(1); }
          const der = Buffer.from(manifest.key, "base64");
          const id = [...crypto.createHash("sha256").update(der).digest().slice(0, 16)]
            .map(b => String.fromCharCode(97 + (b >> 4)) + String.fromCharCode(97 + (b & 15))).join("");
          const swift = fs.readFileSync("App/Sources/McDownloader/Integration/NativeHost.swift", "utf8");
          const locked = (swift.match(/extensionID\s*=\s*"([a-p]{32})"/) || [])[1];
          if (id !== locked) { console.error(`extension id mismatch: key gives ${id}, app pins ${locked}`); process.exit(1); }
          console.log("extension id ok:", id);
          '

  shellcheck:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck all scripts
        run: shellcheck -S warning scripts/*.sh

  torrent-helper:
    name: Compile torrent helper (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libtorrent and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake pkg-config libtorrent-rasterbar-dev
      - name: Configure
        run: cmake -S TorrentHelper -B build-linux -DCMAKE_BUILD_TYPE=Release -DMCD_VERSION=0.0.0-ci
      - name: Build
        run: cmake --build build-linux -j"$(nproc)"
      - name: Smoke-test the RPC surface
        run: |
          ./build-linux/mcdownloader-torrentd --port=6851 --secret=test --save-path=/tmp --state-dir=/tmp/tdstate &
          sleep 3
          curl -s -X POST http://127.0.0.1:6851/jsonrpc \
            -d '{"jsonrpc":"2.0","id":"1","method":"torrent.version","params":["token:test"]}' | tee /dev/stderr | grep -q '"libtorrent"'
          curl -s -X POST http://127.0.0.1:6851/jsonrpc \
            -d '{"jsonrpc":"2.0","id":"2","method":"torrent.version","params":["token:wrong"]}' | grep -q 'invalid token'
          echo "helper RPC ok"
