<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="popup">
  <header class="popup-header">
    <span class="dot" id="status-dot" aria-hidden="true"></span>
    <div>
      <strong>McDownloader</strong>
      <p id="status-text" class="muted">Checking the app…</p>
    </div>
  </header>

  <section class="popup-body">
    <label for="url">Link</label>
    <input id="url" type="text" placeholder="https://… or magnet:…" autocomplete="off" />
    <button id="add" class="primary">Send to McDownloader</button>
    <p id="message" class="muted" role="status" aria-live="polite"></p>
  </section>

  <footer class="popup-footer">
    <a href="#" id="grab">Grab media from this tab</a>
    <a href="#" id="options">Options</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
