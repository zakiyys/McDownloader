<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="220" viewBox="-110 -110 220 220">
  <title>Paw mark, debossed, for light backgrounds</title>
  <defs>
    <!-- outer silhouette: 4 toes + bridge + main pad, stroked so the union reads as one puffy paw -->
    <g id="sil" transform="rotate(-45)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="0" cy="-2" rx="50" ry="30"/>
      <ellipse cx="-62" cy="-4" rx="17" ry="22" transform="rotate(-25 -62 -4)"/>
      <ellipse cx="-24" cy="-40" rx="18" ry="24" transform="rotate(-10 -24 -40)"/>
      <ellipse cx="24" cy="-40" rx="18" ry="24" transform="rotate(10 24 -40)"/>
      <ellipse cx="62" cy="-4" rx="17" ry="22" transform="rotate(25 62 -4)"/>
      <path d="M0 6 C16 6 26 20 40 28 C54 36 52 56 38 62 C26 67 12 62 0 62 C-12 62 -26 67 -38 62 C-52 56 -54 36 -40 28 C-26 20 -16 6 0 6 Z"/>
    </g>
    <!-- pads: second, deeper level inside the silhouette -->
    <g id="pads" transform="rotate(-45)">
      <ellipse cx="-62" cy="-4" rx="17" ry="22" transform="rotate(-25 -62 -4)"/>
      <ellipse cx="-24" cy="-40" rx="18" ry="24" transform="rotate(-10 -24 -40)"/>
      <ellipse cx="24" cy="-40" rx="18" ry="24" transform="rotate(10 24 -40)"/>
      <ellipse cx="62" cy="-4" rx="17" ry="22" transform="rotate(25 62 -4)"/>
      <path d="M0 6 C16 6 26 20 40 28 C54 36 52 56 38 62 C26 67 12 62 0 62 C-12 62 -26 67 -38 62 C-52 56 -54 36 -40 28 C-26 20 -16 6 0 6 Z"/>
    </g>
  </defs>

  <!-- light comes from the top left: dark edge on the top left, bright edge on the bottom right -->
  <use href="#sil" xlink:href="#sil" x="4" y="4" fill="#FFFFFF" stroke="#FFFFFF" opacity="1"/>
  <use href="#sil" xlink:href="#sil" x="-4" y="-4" fill="#000000" stroke="#000000" opacity="0.12"/>
  <use href="#sil" xlink:href="#sil" fill="#F1F2F5" stroke="#F1F2F5"/>

  <use href="#pads" xlink:href="#pads" x="2.4" y="2.4" fill="#FFFFFF" opacity="1"/>
  <use href="#pads" xlink:href="#pads" x="-2.4" y="-2.4" fill="#000000" opacity="0.108"/>
  <use href="#pads" xlink:href="#pads" fill="#E8EAEF"/>
</svg>
