<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E9EF"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <filter id="tile" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.22" result="a"/>
      <feDropShadow in="SourceGraphic" dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14" result="b"/>
      <feMerge><feMergeNode in="a"/><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2A6B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- tile: macOS icon grid, 824px squircle with 100px padding -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tile)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#000000" stroke-opacity="0.05" stroke-width="2"/>

  <g transform="translate(100 100)">
    <!-- ring track -->
    <circle cx="412" cy="412" r="252" fill="none" stroke="#DADFE8" stroke-width="58"/>
    <!-- progress ring 75%, starts at 12 o'clock -->
    <circle cx="412" cy="412" r="252" fill="none" stroke="url(#g1)" stroke-width="58"
            stroke-linecap="round" stroke-dasharray="1187.5 1583.4"
            transform="rotate(-90 412 412)" filter="url(#s1)"/>
    <!-- M whose middle V is the arrowhead, plus the arrow stem -->
    <g stroke="url(#g1)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#s1)">
      <path d="M302 520 V306 L412 446 L522 306 V520"/>
      <line x1="412" y1="262" x2="412" y2="420"/>
    </g>
  </g>
</svg>
